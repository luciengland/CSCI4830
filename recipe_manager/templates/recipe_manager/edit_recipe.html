
{% extends 'recipe_manager/base.html' %}

{% block title %}Edit Recipe{% endblock %}

{% block content %}
        <h1>Edit Recipe: {{ recipe.name }}</h1>

        <form method="POST" class="recipe-form">
            {% csrf_token %}    
            {{ form.as_p }}
            <button type="submit">Save Changes</button>
        </form>

        <a href="{% url 'recipe_detail' recipe.id %}" class="back-link">Cancel</a>
{% endblock %}
