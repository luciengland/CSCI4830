{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Edit Recipe</title>
        <!-- add style sheet -->
        <link rel="stylesheet" href="{% static 'recipe_manager/style.css' %}">
    </head>

    <body>
        <h1>Edit Recipe: {{ recipe.name }}</h1>

        <form method="POST" class="recipe-form">
            {% csrf_token %}    
            {{ form.as_p }}
            <button type="submit">Save Changes</button>
        </form>

        <a href="{% url 'recipe_detail' recipe.id %}" class="back-link">Cancel</a>
    </body>
</html>
