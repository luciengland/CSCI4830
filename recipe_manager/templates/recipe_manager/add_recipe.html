{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Add Recipe</title>
        <!-- add style sheet -->
        <link rel="stylesheet" href="{% static 'recipe_manager/style.css' %}">
    </head>

    <body>
        <h1>Add New Recipe</h1>

        <form method="POST" class="recipe-form">
            {% csrf_token %}    
            {{ form.as_p }}
            <button type="submit">Save Recipe</button>
        </form>
        <a href="{% url 'recipe_list' %}" class="back-link">Cancel</a>
    </body>
</html>
