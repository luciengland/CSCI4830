<!DOCTYPE html>
<html>
    <head>
        <title>Delete Recipe</title>
    </head>

    <body>
        <h1>Delete Recipe</h1>

        <p>Are you sure you want to delete "{{ recipe.name }}"?</p>

        <form method="POST">
            {% csrf_token %}    
            <button type="submit">Delete Recipe</button>
        </form>

        <a href="{% url 'recipe_detail' recipe.id %}">Cancel</a>
    </body>
</html>
