
{% extends 'recipe_manager/base.html' %}

{% block title %}Delete Recipe{% endblock %}

{% block content %}
        <h1>Delete Recipe</h1>

        <div class="delete-confirmation">
            <p>Are you sure you want to delete "{{ recipe.name }}"?</p>

            <form method="POST">
                {% csrf_token %}    
                <button type="submit" class="delete-button">Delete Recipe</button>
            </form>

            <a href="{% url 'recipe_detail' recipe.id %}" class="back-link">Cancel</a>
        </div>
{% endblock %}
